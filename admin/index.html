<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FCI Express – Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="container">

        <!-- LOGIN -->

        <section id="loginSection" class="card">

            <h1>FCI Express</h1>
            <h2>Admin-Bereich</h2>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        E-Mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Passwort
                    </label>

                    <input
                        type="password"
                        id="password"
                        required
                    >

                </div>

                <button type="submit">
                    Anmelden
                </button>

                <p id="loginStatus"></p>

            </form>

        </section>


        <!-- ADMIN -->

        <section
            id="adminSection"
            class="hidden"
        >

            <div class="header">

                <div>
                    <h1>Feedback-Auswertung</h1>

                    <p>
                        FCI Express
                    </p>
                </div>

                <button
                    id="logoutButton"
                    class="logout"
                >
                    Abmelden
                </button>

            </div>


            <!-- STATISTIK -->

            <div class="statistics">

                <div class="stat-card">

                    <span class="stat-number" id="totalCount">
                        0
                    </span>

                    <span class="stat-label">
                        Feedbacks insgesamt
                    </span>

                </div>


                <div class="stat-card">

                    <span class="stat-number" id="noTimeCount">
                        0
                    </span>

                    <span class="stat-label">
                        Ich hatte keine Zeit
                    </span>

                </div>


                <div class="stat-card">

                    <span class="stat-number" id="tooHardCount">
                        0
                    </span>

                    <span class="stat-label">
                        Es war zu schwer
                    </span>

                </div>


                <div class="stat-card">

                    <span class="stat-number" id="noDesireCount">
                        0
                    </span>

                    <span class="stat-label">
                        Ich hatte keine Lust
                    </span>

                </div>


                <div class="stat-card">

                    <span class="stat-number" id="otherCount">
                        0
                    </span>

                    <span class="stat-label">
                        Sonstige
                    </span>

                </div>

            </div>


            <!-- FEEDBACKS -->
             <div class="feedback-header">

                <h2>Feedbacks</h2>

                <div class="feedback-actions">

                    <button
                        id="refreshButton"
                        class="refresh"
                    >
                        Aktualisieren
                    </button>

                    <button
                        id="deleteAllButton"
                        class="delete-all"
                    >
                        Alle löschen
                    </button>

                </div>

            </div>

                <div id="feedbackList">

                    <p>
                        Lade Feedbacks...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="admin.js"></script>

</body>

</html>
