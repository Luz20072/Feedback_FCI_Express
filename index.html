<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FCI Express – Feedback
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="container">

        <section class="feedback-card">

            <h1>
                FCI Express
            </h1>

            <h2>
                Feedback
            </h2>


            <p class="intro">
                Du hast nicht an FCI Express teilgenommen?
                Dann würden wir gerne wissen, warum.
            </p>


            <form id="feedbackForm">


                <!-- ============================= -->
                <!-- NAME -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="name">

                        Name

                        <span class="optional">
                            (optional)
                        </span>

                    </label>


                    <input
                        type="text"
                        id="name"
                        name="name"
                        maxlength="100"
                        placeholder="Du kannst das Feedback anonym abgeben"
                    >

                </div>


                <!-- ============================= -->
                <!-- GRUND -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="reason">
                        Warum hast du nicht teilgenommen?
                    </label>


                    <select
                        id="reason"
                        name="reason"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Bitte auswählen
                        </option>


                        <option value="Keine Zeit">
                            Ich hatte keine Zeit
                        </option>


                        <option value="Zu schwer">
                            Es war zu schwer
                        </option>


                        <option value="Keine Lust">
                            Ich hatte keine Lust
                        </option>


                        <option value="Sonstige">
                            Sonstige
                        </option>

                    </select>

                </div>


                <!-- ============================= -->
                <!-- SONSTIGER GRUND -->
                <!-- ============================= -->

                <div
                    class="form-group hidden"
                    id="additionalTextGroup"
                >

                    <label for="additionalText">
                        Was war der Grund?
                    </label>


                    <textarea
                        id="additionalText"
                        name="additionalText"
                        maxlength="2000"
                        placeholder="Beschreibe deinen Grund..."
                    ></textarea>

                </div>


                <!-- ============================= -->
                <!-- ABSENDEN -->
                <!-- ============================= -->

                <button
                    type="submit"
                    id="submitButton"
                >
                    Feedback absenden
                </button>


                <!-- ============================= -->
                <!-- STATUS -->
                <!-- ============================= -->

                <p
                    id="statusMessage"
                    class="status"
                ></p>


                <!-- ============================= -->
                <!-- NACH ERFOLGREICHEM ABSENDEN -->
                <!-- ============================= -->

                <div
                    id="successActions"
                    class="success-actions hidden"
                >

                    <a
                        href="loesungen/"
                        class="success-button"
                    >
                        Fragen &amp; Lösungen ansehen
                    </a>


                    <a
                        href="kreuzwortraetsel-loesung.pdf"
                        class="success-button secondary"
                        download
                    >
                        PDF herunterladen
                    </a>

                </div>


            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
