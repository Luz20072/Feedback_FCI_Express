<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FCI Express – Kreuzworträtsel
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="container">

        <header class="header">

            <h1>
                FCI Express
            </h1>

            <h2>
                Kreuzworträtsel
            </h2>

            <p>
                Fragen und Lösungen
            </p>

        </header>


        <section
            id="questions"
            class="questions"
        >

            <p class="loading">
                Fragen und Lösungen werden geladen...
            </p>

        </section>


        <section class="actions">

            <a
                href="../"
                class="button secondary"
            >
                Zurück zum Feedback
            </a>


            <a
                href="../kreuzwortraetsel-loesung.pdf"
                class="button"
                download
            >
                PDF herunterladen
            </a>

        </section>

    </main>


    <script>

        // ==========================================
        // ZUGRIFFSKONTROLLE
        // ==========================================

        const feedbackSubmitted =
            sessionStorage.getItem(
                "feedbackSubmitted"
            );


        /*
         * Wenn in diesem Browser-Tab noch kein
         * erfolgreiches Feedback abgeschickt wurde,
         * geht es zurück zur Hauptseite.
         */

        if (feedbackSubmitted !== "true") {

            window.location.replace("../");

        }


        // ==========================================
        // JSON-DATEI
        // ==========================================

        const JSON_DATEI =
            "../fragen.json";


        // ==========================================
        // HTML-ELEMENT
        // ==========================================

        const questions =
            document.getElementById(
                "questions"
            );


        // ==========================================
        // FRAGEN LADEN
        // ==========================================

        async function loadQuestions() {

            try {

                const response =
                    await fetch(
                        JSON_DATEI
                    );


                // JSON erfolgreich geladen?

                if (!response.ok) {

                    throw new Error(
                        "JSON konnte nicht geladen werden."
                    );

                }


                // JSON auslesen

                const data =
                    await response.json();


                // Prüfen, ob Array

                if (!Array.isArray(data)) {

                    throw new Error(
                        "Die JSON muss ein Array enthalten."
                    );

                }


                // Ladehinweis entfernen

                questions.innerHTML = "";


                // ==================================
                // FRAGEN DARSTELLEN
                // ==================================

                data.forEach((entry) => {

                    /*
                     * Container für einen Eintrag
                     */

                    const article =
                        document.createElement(
                            "article"
                        );

                    article.className =
                        "question";


                    /*
                     * Frage
                     */

                    const clue =
                        document.createElement(
                            "p"
                        );

                    clue.className =
                        "clue";

                    clue.textContent =
                        entry.clue;


                    /*
                     * Antwort-Container
                     */

                    const answer =
                        document.createElement(
                            "div"
                        );

                    answer.className =
                        "answer";


                    /*
                     * "Antwort:"
                     */

                    const answerLabel =
                        document.createElement(
                            "span"
                        );

                    answerLabel.textContent =
                        "Antwort:";


                    /*
                     * Lösung
                     */

                    const solution =
                        document.createElement(
                            "strong"
                        );

                    solution.textContent =
                        entry.solution;


                    /*
                     * Antwort zusammenbauen
                     */

                    answer.appendChild(
                        answerLabel
                    );

                    answer.appendChild(
                        solution
                    );


                    /*
                     * Frage zusammenbauen
                     */

                    article.appendChild(
                        clue
                    );

                    article.appendChild(
                        answer
                    );


                    /*
                     * Zur Seite hinzufügen
                     */

                    questions.appendChild(
                        article
                    );

                });


                // ==================================
                // KEINE FRAGEN
                // ==================================

                if (data.length === 0) {

                    questions.innerHTML = `

                        <div class="error">

                            <h3>
                                Keine Fragen gefunden
                            </h3>

                            <p>
                                Die JSON-Datei enthält
                                keine Fragen.
                            </p>

                        </div>

                    `;

                }


            } catch (error) {

                console.error(
                    error
                );


                questions.innerHTML = `

                    <div class="error">

                        <h3>
                            Fehler beim Laden
                        </h3>

                        <p>
                            Die Fragen und Lösungen
                            konnten nicht geladen werden.
                        </p>

                    </div>

                `;

            }

        }


        // ==========================================
        // START
        // ==========================================

        loadQuestions();

    </script>


</body>

</html>
